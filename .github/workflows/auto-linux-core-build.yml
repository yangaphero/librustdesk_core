name: 自动触发 Linux 核心构建

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/cleanup-releases.yml'
      - '.github/workflows/auto-linux-core-build.yml'
      - '.github/workflows/update-core-release-notes.yml'
      - '.github/workflows/manual-update-core-release-notes.yml'

permissions:
  actions: write
  contents: write

jobs:
  trigger:
    name: 触发并等待 Linux 核心构建
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 触发 Linux 构建流程
        id: trigger_linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ref_name="${{ github.ref_name }}"
          if [ -z "$ref_name" ]; then
            ref_name="main"
          fi
          echo "ref_name=$ref_name" >> "$GITHUB_OUTPUT"
          echo "触发构建 workflow..."
          gh workflow run build-core-linux.yml --repo "${{ github.repository }}" --ref "$ref_name"

      - name: 等待刚触发的 Linux 构建流程完成
        id: linux_run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ steps.trigger_linux.outputs.ref_name }}
        run: |
          set -euo pipefail
          echo "等待构建完成..."
          
          # 等待最多 180 分钟
          run_id=$(gh run watch --repo "${{ github.repository }}" --workflow build-core-linux.yml --branch "$REF_NAME" --limit 1 --watch --json databaseId --jq '.[0].databaseId' || true)
          
          # 如果 watch 失败或未返回，尝试手动检查
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "gh run watch 未能获取 run ID，尝试手动检测..."
            for i in $(seq 1 720); do
              sleep 15
              run_status=$(gh run list --repo "${{ github.repository }}" --workflow build-core-linux.yml --branch "$REF_NAME" --limit 1 --json status,conclusion --jq '.[0].status // "unknown"' || echo "unknown")
              run_conclusion=$(gh run list --repo "${{ github.repository }}" --workflow build-core-linux.yml --branch "$REF_NAME" --limit 1 --json conclusion --jq '.[0].conclusion // "unknown"' || echo "unknown")
              
              echo "当前构建状态: $run_status, 结论: $run_conclusion (等待 $i 轮)"
              
              if [ "$run_status" = "completed" ]; then
                if [ "$run_conclusion" = "success" ]; then
                  echo "✓ 构建成功完成"
                  run_id=$(gh run list --repo "${{ github.repository }}" --workflow build-core-linux.yml --branch "$REF_NAME" --limit 1 --json databaseId --jq '.[0].databaseId')
                  echo "linux_run_id=$run_id" >> "$GITHUB_OUTPUT"
                  break
                elif [ "$run_conclusion" = "failure" ]; then
                  echo "✗ 构建失败"
                  exit 1
                fi
              fi
            done
          else
            echo "✓ 构建流程完成，run ID: $run_id"
            echo "linux_run_id=$run_id" >> "$GITHUB_OUTPUT"
          fi

      - name: 定位最新核心库 Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag=$(
            gh release list --repo "${{ github.repository }}" --limit 50 --json tagName,createdAt \
              --jq '[.[] | select(.tagName | test("^core-[0-9]{3}$"))] | sort_by(.createdAt) | last | .tagName'
          )
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "没有找到核心库 Release。"
            exit 1
          fi
          number="${tag#core-}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: 生成发布说明
        env:
          RELEASE_NUMBER: ${{ steps.release.outputs.number }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          BUILD_OS: Ubuntu 22.04
        run: |
          echo "# HarmonyOS Core ${{ steps.release.outputs.tag }}" > release-notes.md
          echo "" >> release-notes.md
          echo "- 构建环境: $BUILD_OS" >> release-notes.md
          echo "" >> release-notes.md
          echo "## 构建产物" >> release-notes.md
          echo "" >> release-notes.md
          echo "- arm64: librustdesk_core.a" >> release-notes.md
          echo "- x86_64: librustdesk_core_x86_64.a" >> release-notes.md
