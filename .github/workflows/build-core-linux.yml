name: 构建 HarmonyOS 核心库（Linux）

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: 构建核心库（${{ matrix.lib_dir }}）
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-ohos
            clang_target: aarch64-linux-ohos
            triplet: arm64-linux
            lib_dir: arm64
            artifact_name: librustdesk_core_linux_arm64
            release_file: librustdesk_core.a
          - target: x86_64-unknown-linux-ohos
            clang_target: x86_64-linux-ohos
            triplet: x64-linux
            lib_dir: x86_64
            artifact_name: librustdesk_core_linux_x86_64
            release_file: librustdesk_core_x86_64.a

    env:
      TARGET_TRIPLE: ${{ matrix.target }}
      CLANG_TARGET: ${{ matrix.clang_target }}
      TRIPLET: ${{ matrix.triplet }}
      RUST_TOOLCHAIN_VERSION: "1.88.0"
      RUSTDESK_HARMONY_BUILD_DIR: ${{ github.workspace }}/_build
      CARGO_TARGET_DIR: ${{ github.workspace }}/_build/native_rust_core/target
      VCPKG_ROOT: ${{ github.workspace }}/_build/vcpkg
      VCPKG_INSTALLED_ROOT: ${{ github.workspace }}/_build/vcpkg/installed
      SDK_VERSION: 6.1.1.280
      SDK_REPO: ErBWs/ohos-sdk

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.target }}

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build autoconf automake libtool autoconf-archive \
            pkg-config perl python3 curl git unzip p7zip-full \
            libssl-dev tar gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: 准备构建目录
        run: |
          mkdir -p "$RUSTDESK_HARMONY_BUILD_DIR" "$VCPKG_ROOT" "$VCPKG_INSTALLED_ROOT"
          echo "Build directory created"

      - name: 下载 OHOS SDK
        run: |
          set -euo pipefail
          sdk_archive="$RUSTDESK_HARMONY_BUILD_DIR/ohos-sdk.tar.gz"
          sdk_root="$RUSTDESK_HARMONY_BUILD_DIR/ohos-sdk"
          
          echo "Downloading OHOS SDK from $SDK_REPO..."
          cd "$RUSTDESK_HARMONY_BUILD_DIR"
          
          for part in aa ab; do
            echo "Downloading part $part..."
            curl -L -f -o "ohos-sdk.$part" "https://github.com/$SDK_REPO/releases/download/$SDK_VERSION/ohos-sdk-linux-amd64.tar.gz.$part" || {
              echo "Failed to download part $part"
              exit 1
            }
          done
          
          echo "Merging parts..."
          cat ohos-sdk.aa ohos-sdk.ab > "$sdk_archive"
          rm -f ohos-sdk.aa ohos-sdk.ab
          
          echo "Extracting SDK..."
          tar -xzf "$sdk_archive" -C "$RUSTDESK_HARMONY_BUILD_DIR" || {
            echo "Failed to extract SDK"
            exit 1
          }
          rm -f "$sdk_archive"
          
          # 查找 SDK 根目录（包含 native/llvm/bin/clang 和 native/sysroot 的目录）
          echo "Finding SDK root directory..."
          SDK_CANDIDATE=""
          
          # 方法1：直接检查已知路径（OHOS SDK Linux 版的标准结构）
          if [ -f "$RUSTDESK_HARMONY_BUILD_DIR/command-line-tools/sdk/default/openharmony/native/llvm/bin/clang" ] && \
             [ -d "$RUSTDESK_HARMONY_BUILD_DIR/command-line-tools/sdk/default/openharmony/native/sysroot" ]; then
            SDK_CANDIDATE="$RUSTDESK_HARMONY_BUILD_DIR/command-line-tools/sdk/default/openharmony"
            echo "Found SDK at standard path: $SDK_CANDIDATE"
          elif [ -d "$RUSTDESK_HARMONY_BUILD_DIR/openharmony/native/llvm/bin" ] && \
               [ -d "$RUSTDESK_HARMONY_BUILD_DIR/openharmony/native/sysroot" ]; then
            SDK_CANDIDATE="$RUSTDESK_HARMONY_BUILD_DIR/openharmony"
            echo "Found SDK at direct path: $SDK_CANDIDATE"
          else
            # 方法2：使用 find 查找（兼容非标准结构）
            echo "Using find to locate SDK..."
            SDK_CANDIDATE=$(find "$RUSTDESK_HARMONY_BUILD_DIR" -type d -name "openharmony" 2>/dev/null | while read dir; do
              if [ -f "$dir/native/llvm/bin/clang" ] || [ -L "$dir/native/llvm/bin/clang" ]; then
                if [ -d "$dir/native/sysroot" ]; then
                  echo "$dir"
                  break
                fi
              fi
            done)
            echo "Found SDK at: $SDK_CANDIDATE"
          fi
          
          if [ -z "$SDK_CANDIDATE" ]; then
            echo "ERROR: Cannot find SDK root directory"
            echo "Searching for clang..."
            find "$RUSTDESK_HARMONY_BUILD_DIR" -name "clang" 2>/dev/null | head -5
            echo "Directory structure:"
            find "$RUSTDESK_HARMONY_BUILD_DIR" -maxdepth 4 -type d | head -30
            exit 1
          fi
          
          # 移动到标准位置
          mkdir -p "$(dirname "$sdk_root")"
          mv "$SDK_CANDIDATE" "$sdk_root"
          
          echo "SDK installed to: $sdk_root"
          echo "Verifying SDK structure..."
          ls -la "$sdk_root/native/llvm/bin/" | head -10
          ls -la "$sdk_root/native/sysroot/" | head -5
          
          # 验证必要条件
          if [ ! -x "$sdk_root/native/llvm/bin/clang" ] && [ ! -L "$sdk_root/native/llvm/bin/clang" ]; then
            echo "ERROR: clang not found or not executable at $sdk_root/native/llvm/bin/clang"
            exit 1
          fi
          if [ ! -d "$sdk_root/native/sysroot" ]; then
            echo "ERROR: sysroot not found at $sdk_root/native/sysroot"
            exit 1
          fi
          echo "✓ SDK verification passed"

      - name: 安装 vcpkg
        run: |
          echo "Preparing vcpkg..."
          rm -rf "$VCPKG_ROOT"
          mkdir -p "$VCPKG_ROOT"
          
          echo "Cloning vcpkg..."
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT" || {
            echo "Failed to clone vcpkg"
            exit 1
          }
          
          echo "Bootstrapping vcpkg..."
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics || {
            echo "Failed to bootstrap vcpkg"
            exit 1
          }
          
          VCPKG_BIN="$VCPKG_ROOT/vcpkg"
          
          echo "Installing libsodium for $TRIPLET..."
          "$VCPKG_BIN" install libsodium:"$TRIPLET" --triplet="$TRIPLET" || {
            echo "Failed to install libsodium"
            exit 1
          }
          
          echo "Installing opus for $TRIPLET..."
          "$VCPKG_BIN" install opus:"$TRIPLET" --triplet="$TRIPLET" || {
            echo "Failed to install opus"
            exit 1
          }
          
          echo "vcpkg installation completed"

      - name: 显示构建环境
        run: |
          echo "=== Build Environment ==="
          echo "TARGET_TRIPLE: $TARGET_TRIPLE"
          echo "TRIPLET: $TRIPLET"
          echo "OHOS_SDK_HOME: $OHOS_SDK_HOME"
          echo "VCPKG_ROOT: $VCPKG_ROOT"
          echo "========================"

      - name: 确保构建脚本可执行
        run: |
          chmod +x scripts/*.sh
          for f in scripts/aarch64-unknown-linux-ohos-clang.sh \
                   scripts/x86_64-unknown-linux-ohos-clang.sh \
                   scripts/ohos-llvm-ar.sh \
                   scripts/build_native_bridge.sh \
                   scripts/_ohos-sdk-env.sh; do
            test -x "$f" || { echo "ERROR: $f is not executable"; exit 1; }
          done

      - name: 构建核心库
        run: |
          set -euo pipefail
          export PATH="$VCPKG_ROOT:$PATH"
          export OHOS_SDK_HOME="$RUSTDESK_HARMONY_BUILD_DIR/ohos-sdk"
          export VCPKG_FORCE_SYSTEM_BINARIES=1
          export PKG_CONFIG_PATH="$VCPKG_INSTALLED_ROOT/$TRIPLET/lib/pkgconfig"
          export SODIUM_LIB_DIR="$VCPKG_INSTALLED_ROOT/$TRIPLET/lib"
          export SODIUM_INCLUDE_DIR="$VCPKG_INSTALLED_ROOT/$TRIPLET/include"

          echo "=== Starting Build ==="
          echo "Building for target: $TARGET_TRIPLE"
          echo "Triplet: $TRIPLET"
          echo "SDK home: $OHOS_SDK_HOME"
          echo "Vcpkg root: $VCPKG_ROOT"

          bash scripts/build_native_bridge.sh "$TARGET_TRIPLE" release 2>&1 || {
            echo "Build failed with exit code $?"
            exit 1
          }

          echo "=== Build Completed ==="

      - name: 验证构建产物
        run: |
          echo "=== Checking Build Artifacts ==="
          artifact_dir="$RUSTDESK_HARMONY_BUILD_DIR/native_rust_core/target/${{ matrix.target }}/release"
          echo "Artifact directory: $artifact_dir"
          ls -la "$artifact_dir" 2>/dev/null || echo "Artifact directory not found"
          
          if [ -f "$artifact_dir/${{ matrix.release_file }}" ]; then
            echo "✓ ${{ matrix.release_file }} found"
            ls -lh "$artifact_dir/${{ matrix.release_file }}"
          elif [ -f "$artifact_dir/librustdesk_harmony_bridge.a" ]; then
            echo "✓ librustdesk_harmony_bridge.a found (copying to ${{ matrix.release_file }})"
            cp "$artifact_dir/librustdesk_harmony_bridge.a" "$artifact_dir/${{ matrix.release_file }}"
            ls -lh "$artifact_dir/${{ matrix.release_file }}"
          elif [ -f "$artifact_dir/rustdesk_harmony_bridge.a" ]; then
            echo "✓ rustdesk_harmony_bridge.a found (copying to ${{ matrix.release_file }})"
            cp "$artifact_dir/rustdesk_harmony_bridge.a" "$artifact_dir/${{ matrix.release_file }}"
            ls -lh "$artifact_dir/${{ matrix.release_file }}"
          else
            echo "✗ No static library found!"
            find "$artifact_dir" -name "*.a" 2>/dev/null | head -10
            exit 1
          fi

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ github.workspace }}/_build/native_rust_core/target/${{ matrix.target }}/release/${{ matrix.release_file }}
          retention-days: 7

  release:
    name: 创建 Release
    needs: build
    runs-on: ubuntu-22.04
    if: success()
    steps:
      - name: 下载所有产物
        uses: actions/download-artifact@v4

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          
          existing_numbers=$(
            gh api repos/${{ github.repository }}/git/matching-refs/tags/core- --paginate --jq '.[].ref' \
              | sed 's#^refs/tags/##' \
              | grep -E '^core-[0-9]{3}$' \
              | sed 's/^core-//' \
              | sort -n || true
          )
          if [ -z "$existing_numbers" ]; then
            next=1
          else
            last=$(printf '%s\n' "$existing_numbers" | tail -1)
            next=$((10#$last + 1))
          fi
          tag="core-$(printf '%03d' $next)"
          
          echo "Creating release: $tag"
          
          # 检查产物是否存在
          ls -la librustdesk_core_linux_arm64/ 2>/dev/null || true
          ls -la librustdesk_core_linux_x86_64/ 2>/dev/null || true
          
          gh release create "$tag" \
            --title "HarmonyOS Core $tag" \
            --generate-notes \
            librustdesk_core_linux_arm64/librustdesk_core.a \
            librustdesk_core_linux_x86_64/librustdesk_core_x86_64.a || {
            echo "Failed to create release"
            exit 1
          }
          
          echo "Release created: $tag"
