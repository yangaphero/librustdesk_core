name: 构建 HarmonyOS 核心库（Linux）

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reserve_release_number:
    name: 预留发布版本号
    runs-on: ubuntu-latest
    outputs:
      release_number: ${{ steps.reserve.outputs.release_number }}
      tag: ${{ steps.reserve.outputs.tag }}
    steps:
      - name: 预留下一个核心库标签
        id: reserve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          existing_numbers=$(
            gh api repos/${{ github.repository }}/git/matching-refs/tags/core- --paginate --jq '.[].ref' \
              | sed 's#^refs/tags/##' \
              | grep -E '^core-[0-9]{3}$' \
              | sed 's/^core-//' \
              | sort -n || true
          )

          if [ -z "$existing_numbers" ]; then
            next=1
          else
            last=$(printf '%s\n' "$existing_numbers" | tail -1)
            next=$((10#$last + 1))
          fi

          release_number=$(printf '%03d' "$next")
          tag="core-$release_number"

          echo "Reserving release tag: $tag"
          gh api -X POST repos/${{ github.repository }}/git/refs \
            -f ref="refs/tags/$tag" \
            -f sha="${{ github.sha }}"

          echo "release_number=$release_number" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: Linux 构建核心库（${{ matrix.lib_dir }}）
    needs: reserve_release_number
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-ohos
            clang_target: aarch64-linux-ohos
            configure_host: aarch64-unknown-linux-gnu
            triplet: arm64-linux
            lib_dir: arm64
            cmake_processor: aarch64
            vpx_target: arm64-linux-gcc
            opus_extra_configure: ""
            artifact_name: librustdesk_core_linux_arm64
            release_file: librustdesk_core.a
          - target: x86_64-unknown-linux-ohos
            clang_target: x86_64-linux-ohos
            configure_host: x86_64-unknown-linux-gnu
            triplet: x64-linux
            lib_dir: x86_64
            cmake_processor: x86_64
            vpx_target: generic-gnu
            opus_extra_configure: "--disable-asm --disable-rtcd --disable-intrinsics"
            artifact_name: librustdesk_core_linux_x86_64
            release_file: librustdesk_core_x86_64.a

    env:
      TARGET_TRIPLE: ${{ matrix.target }}
      CLANG_TARGET: ${{ matrix.clang_target }}
      CONFIGURE_HOST: ${{ matrix.configure_host }}
      TRIPLET: ${{ matrix.triplet }}
      LIB_DIR: ${{ matrix.lib_dir }}
      CMAKE_PROCESSOR: ${{ matrix.cmake_processor }}
      VPX_TARGET: ${{ matrix.vpx_target }}
      OPUS_EXTRA_CONFIGURE: ${{ matrix.opus_extra_configure }}
      RUST_TOOLCHAIN_VERSION: "1.88.0"
      RUSTDESK_HARMONY_BUILD_DIR: ${{ github.workspace }}/_build
      CARGO_TARGET_DIR: ${{ github.workspace }}/_build/native_rust_core/target
      VCPKG_ROOT: ${{ github.workspace }}/_build/vcpkg
      VCPKG_INSTALLED_ROOT: ${{ github.workspace }}/_build/vcpkg/installed
      RUST_BACKTRACE: full
      CARGO_BUILD_JOBS: "2"
      RELEASE_ARTIFACT_MIN_BYTES: "100000000"
      RELEASE_ARTIFACT_MAX_BYTES: "250000000"

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: ${{ matrix.target }}

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build autoconf automake libtool \
            pkg-config perl python3 curl git unzip p7zip-full

      - name: 准备构建目录
        run: |
          mkdir -p "$RUSTDESK_HARMONY_BUILD_DIR" "$VCPKG_ROOT" "$VCPKG_INSTALLED_ROOT"
      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.pulumi 2>/dev/null || true
          sudo docker rmi $(docker images -q) 2>/dev/null || true
          sudo apt-get clean 2>/dev/null || true
          df -h /

      - name: 下载 HarmonyOS Native SDK
        run: |
          set -euo pipefail
          sdk_root="$RUSTDESK_HARMONY_BUILD_DIR/ohos-native-sdk"
          rm -rf "$sdk_root"
          mkdir -p "$sdk_root"

          echo "Downloading OHOS native SDK..."
          curl -L -f --retry 3 -o /tmp/ohos-native-sdk.tar.gz \
            "https://github.com/yangaphero/librustdesk_core/releases/download/ohos-native-sdk/ohos-native-sdk.tar.gz"

          actual_size=$(stat -c %s /tmp/ohos-native-sdk.tar.gz)
          expected_size=908023991
          if [ "$actual_size" != "$expected_size" ]; then
            echo "ERROR: downloaded file truncated: got $actual_size bytes, expected $expected_size"
            exit 1
          fi
          echo "Download verified: $actual_size bytes"

          echo "Extracting..."
          tar xzf /tmp/ohos-native-sdk.tar.gz -C "$sdk_root"
          rm -f /tmp/ohos-native-sdk.tar.gz

          # 验证关键文件
          for f in "$sdk_root/llvm/bin/clang" "$sdk_root/llvm/bin/clang++" "$sdk_root/llvm/bin/llvm-ar" "$sdk_root/sysroot/usr/lib/aarch64-linux-ohos"; do
            [ -e "$f" ] || { echo "ERROR: missing $f"; exit 1; }
          done

          # 兼容标准 DevEco 布局（scripts/_ohos-sdk-env.sh 期望 $SDK/native/llvm/bin）
          ln -s . "$sdk_root/native"
          [ -e "$sdk_root/native/llvm/bin/clang" ] || { echo "ERROR: native symlink failed"; exit 1; }

          echo "OHOS_SDK_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "OHOS_NDK_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "RUSTDESK_HARMONY_HOST_SDK=$sdk_root" >> "$GITHUB_ENV"
          echo "SDK ready: $sdk_root"

      - name: 缓存 Cargo 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ github.workspace }}/_build/native_rust_core/target
          key: linux-ohos-${{ matrix.lib_dir }}-cargo-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            linux-ohos-${{ matrix.lib_dir }}-cargo-v2-

      - name: 缓存 OHOS 外部静态库
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/_build/vcpkg/installed
            ${{ github.workspace }}/_build/downloads
            ${{ github.workspace }}/_build/build/libsodium
          key: linux-ohos-extlibs-${{ matrix.target }}-opus-1.5.2-vpx-1.15.2-yuv-0faf8dd0e004520a61a603a4d2996d5ecc80dc3f-libsodium-0.2.7
          restore-keys: |
            linux-ohos-extlibs-${{ matrix.target }}-

      - name: 准备 libsodium-sys 源码
        run: |
          registry_src="$HOME/.cargo/registry/src"
          crate_dir="$registry_src/manual/libsodium-sys-0.2.7"
          if [ ! -d "$crate_dir" ]; then
            fetch_dir="$RUNNER_TEMP/libsodium-sys-fetch"
            rm -rf "$fetch_dir"
            mkdir -p "$fetch_dir/src" "$registry_src/manual"
            cat > "$fetch_dir/Cargo.toml" <<'EOF'
          [package]
          name = "libsodium-sys-fetch"
          version = "0.1.0"
          edition = "2021"

          [dependencies]
          libsodium-sys = "=0.2.7"
          EOF
            printf 'pub fn libsodium_sys_fetch_dummy() {}\n' > "$fetch_dir/src/lib.rs"
            CARGO_NET_RETRY=5 cargo fetch --manifest-path "$fetch_dir/Cargo.toml"
            fetched_crate=$(find "$registry_src" -mindepth 2 -maxdepth 2 -type d -name 'libsodium-sys-0.2.7' | grep -v '/manual/' | head -n 1)
            [ -n "$fetched_crate" ] || { echo "libsodium-sys-0.2.7 not found after cargo fetch"; exit 1; }
            cp -a "$fetched_crate" "$crate_dir"
          fi
          test -d "$crate_dir/libsodium"

          # 给 registry 中的真实 libsodium-sys 打补丁：
          # - HOST 侧（rustdesk 的 build-dependencies hbb_common 链）：不发任何链接指令，
          #   extern 声明未被引用即被丢弃，build script 可正常链接（无需 host libsodium）
          # - CROSS 侧（OHOS 目标）：必须使用 SODIUM_LIB_DIR 预编译库，禁止触发 vendored
          #   autotools 构建（config.sub 不识别 OHOS triple）
          python3 scripts/patch_libsodium_sys.py \
            "$HOME/.cargo/registry/src"/*/libsodium-sys-0.2.7/build.rs \
            "$crate_dir/build.rs"

      - name: 编译 libopus
        run: |
          opus_version="1.5.2"
          opus_root="$RUSTDESK_HARMONY_BUILD_DIR/opus-$LIB_DIR"
          opus_tar="$RUSTDESK_HARMONY_BUILD_DIR/downloads/opus-$opus_version.tar.gz"
          install_root="$VCPKG_INSTALLED_ROOT/$TRIPLET"
          include_dir="$install_root/include"
          lib_dir="$install_root/lib"
          if [ -f "$include_dir/opus/opus_multistream.h" ] && [ -f "$lib_dir/libopus.a" ]; then exit 0; fi
          mkdir -p "$opus_root" "$include_dir" "$lib_dir" "$(dirname "$opus_tar")"
          [ -f "$opus_tar" ] || curl -fSL -o "$opus_tar" "https://downloads.xiph.org/releases/opus/opus-$opus_version.tar.gz"
          rm -rf "$opus_root" && mkdir -p "$opus_root"
          tar -xzf "$opus_tar" -C "$opus_root" --strip-components=1
          sdk_llvm_bin="$RUSTDESK_HARMONY_HOST_SDK/llvm/bin"
          sdk_sysroot="$RUSTDESK_HARMONY_HOST_SDK/sysroot"
          cd "$opus_root"
          export CC="$sdk_llvm_bin/clang"
          export AR="$sdk_llvm_bin/llvm-ar"
          export RANLIB="$sdk_llvm_bin/llvm-ranlib"
          export STRIP=":"
          export SYSROOT="$sdk_sysroot"
          export CFLAGS="--target=$CLANG_TARGET --sysroot=$SYSROOT -fPIC -D__MUSL__"
          export LDFLAGS="--target=$CLANG_TARGET --sysroot=$SYSROOT"
          ./configure --host="$CONFIGURE_HOST" --prefix="$install_root" --enable-shared=no --enable-static=yes --disable-extra-programs --disable-doc $OPUS_EXTRA_CONFIGURE
          make -j$(nproc)
          make install
          test -f "$include_dir/opus/opus_multistream.h"
          test -f "$lib_dir/libopus.a"

      - name: 编译 libvpx
        run: |
          version="1.15.2"
          install_root="$VCPKG_INSTALLED_ROOT/$TRIPLET"
          include_dir="$install_root/include"
          lib_dir="$install_root/lib"
          source_dir="$RUSTDESK_HARMONY_BUILD_DIR/external-src/libvpx-$version-$LIB_DIR"
          archive_path="$RUSTDESK_HARMONY_BUILD_DIR/downloads/libvpx-$version.tar.gz"
          if [ -f "$include_dir/vpx/vpx_decoder.h" ] && [ -f "$lib_dir/libvpx.a" ]; then exit 0; fi
          rm -rf "$source_dir" && mkdir -p "$source_dir" "$include_dir" "$lib_dir" "$(dirname "$archive_path")"
          [ -f "$archive_path" ] || curl -fSL -o "$archive_path" "https://github.com/webmproject/libvpx/archive/refs/tags/v$version.tar.gz"
          tar -xzf "$archive_path" -C "$source_dir" --strip-components=1
          sdk_llvm_bin="$RUSTDESK_HARMONY_HOST_SDK/llvm/bin"
          sdk_sysroot="$RUSTDESK_HARMONY_HOST_SDK/sysroot"
          arch_include="$sdk_sysroot/usr/include/$CLANG_TARGET"
          usr_include="$sdk_sysroot/usr/include"
          cd "$source_dir"
          rm -rf build-ohos && mkdir -p build-ohos && cd build-ohos
          export PATH="$sdk_llvm_bin:$PATH"
          export CC="$sdk_llvm_bin/clang"
          export CXX="$sdk_llvm_bin/clang++"
          export LD="$sdk_llvm_bin/ld.lld"
          export AR="$sdk_llvm_bin/llvm-ar"
          export RANLIB="$sdk_llvm_bin/llvm-ranlib"
          export NM="$sdk_llvm_bin/llvm-nm"
          export STRIP=":"
          export CFLAGS="--target=$CLANG_TARGET --sysroot=$sdk_sysroot -I$arch_include -I$usr_include -D__MUSL__ -fPIC -O2"
          export CXXFLAGS="$CFLAGS"
          export LDFLAGS="--target=$CLANG_TARGET --sysroot=$sdk_sysroot"
          ../configure --target="$VPX_TARGET" --prefix="$install_root" --libdir="$install_root/lib" --enable-static --disable-shared --disable-examples --disable-tools --disable-docs --disable-unit-tests --disable-install-bins --disable-install-srcs --disable-dependency-tracking --disable-runtime-cpu-detect --enable-vp8 --enable-vp9 --enable-vp9-highbitdepth
          make -j$(nproc) libvpx.a
          mkdir -p "$install_root/include/vpx" "$install_root/lib/pkgconfig"
          cp -f libvpx.a "$install_root/lib/libvpx.a"
          for h in vp8.h vp8cx.h vp8dx.h vpx_codec.h vpx_decoder.h vpx_encoder.h vpx_ext_ratectrl.h vpx_frame_buffer.h vpx_image.h vpx_integer.h vpx_tpl.h; do cp -f "../vpx/$h" "$install_root/include/vpx/$h"; done

      - name: 编译 libyuv
        run: |
          revision="0faf8dd0e004520a61a603a4d2996d5ecc80dc3f"
          install_root="$VCPKG_INSTALLED_ROOT/$TRIPLET"
          include_dir="$install_root/include"
          lib_dir="$install_root/lib"
          source_dir="$RUSTDESK_HARMONY_BUILD_DIR/external-src/libyuv-$revision"
          archive_path="$RUSTDESK_HARMONY_BUILD_DIR/downloads/libyuv-$revision.tar.gz"
          if [ -f "$include_dir/libyuv/convert_argb.h" ] && [ -f "$lib_dir/libyuv.a" ]; then exit 0; fi
          rm -rf "$source_dir" && mkdir -p "$source_dir" "$(dirname "$archive_path")"
          [ -f "$archive_path" ] || curl -fSL -o "$archive_path" "https://github.com/lemenkov/libyuv/archive/$revision.tar.gz"
          tar -xzf "$archive_path" -C "$source_dir" --strip-components=1
          sdk_llvm_bin="$RUSTDESK_HARMONY_HOST_SDK/llvm/bin"
          sdk_sysroot="$RUSTDESK_HARMONY_HOST_SDK/sysroot"
          build_dir="$RUSTDESK_HARMONY_BUILD_DIR/external-src/libyuv-$revision-build-$LIB_DIR"
          rm -rf "$build_dir" && mkdir -p "$build_dir" "$include_dir" "$lib_dir"
          c_flags="--target=$CLANG_TARGET --sysroot=$sdk_sysroot -D__MUSL__ -fPIC -O2"
          cmake -S "$source_dir" -B "$build_dir" -G Ninja -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR="$CMAKE_PROCESSOR" -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER="$sdk_llvm_bin/clang" -DCMAKE_CXX_COMPILER="$sdk_llvm_bin/clang++" -DCMAKE_AR="$sdk_llvm_bin/llvm-ar" -DCMAKE_RANLIB="$sdk_llvm_bin/llvm-ranlib" -DCMAKE_C_FLAGS="$c_flags" -DCMAKE_CXX_FLAGS="$c_flags" -DCMAKE_EXE_LINKER_FLAGS="--target=$CLANG_TARGET --sysroot=$sdk_sysroot" -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DCMAKE_DISABLE_FIND_PACKAGE_JPEG=ON -DTEST=OFF -DCMAKE_INSTALL_PREFIX="$install_root"
          cmake --build "$build_dir" --config Release --target yuv --parallel $(nproc)
          cp -f "$build_dir/libyuv.a" "$lib_dir/libyuv.a"
          mkdir -p "$include_dir/libyuv"
          cp -rf "$source_dir/include/libyuv/"* "$include_dir/libyuv/"

      - name: 编译 libsodium
        run: |
          install_dir="$RUSTDESK_HARMONY_BUILD_DIR/build/libsodium/$TARGET_TRIPLE"
          final_lib="$install_dir/lib/liblibsodium.a"
          if [ -f "$final_lib" ]; then exit 0; fi
          source_dir="$HOME/.cargo/registry/src/manual/libsodium-sys-0.2.7/libsodium"
          [ -d "$source_dir" ] || { echo "libsodium source not found: $source_dir"; exit 1; }
          work_root="$RUSTDESK_HARMONY_BUILD_DIR/external-src/libsodium-$TARGET_TRIPLE"
          rm -rf "$work_root" "$install_dir"
          mkdir -p "$work_root/source" "$install_dir"
          cp -rf "$source_dir" "$work_root/source/libsodium"
          sdk_llvm_bin="$RUSTDESK_HARMONY_HOST_SDK/llvm/bin"
          sdk_sysroot="$RUSTDESK_HARMONY_HOST_SDK/sysroot"
          arch_include="$sdk_sysroot/usr/include/$CLANG_TARGET"
          usr_include="$sdk_sysroot/usr/include"
          cd "$work_root/source/libsodium"
          export PATH="$sdk_llvm_bin:$PATH"
          export CC="$sdk_llvm_bin/clang"
          export LD="$sdk_llvm_bin/ld.lld"
          export AR="$sdk_llvm_bin/llvm-ar"
          export RANLIB="$sdk_llvm_bin/llvm-ranlib"
          export NM="$sdk_llvm_bin/llvm-nm"
          export STRIP=":"
          export LDCONFIG=":"
          export CFLAGS="--target=$CLANG_TARGET --sysroot=$sdk_sysroot -I$arch_include -I$usr_include -D__MUSL__"
          ./configure --host="$CONFIGURE_HOST" --prefix="$install_dir" --libdir="$install_dir/lib" --enable-shared=no
          make -j$(nproc) all
          make install
          cp -f "$install_dir/lib/libsodium.a" "$install_dir/lib/liblibsodium.a"
          test -f "$final_lib"

      - name: 编译 librustdesk_core.a
        run: |
          chmod +x scripts/build_native_bridge.sh scripts/_ohos-sdk-env.sh scripts/ohos-llvm-ar.sh
          chmod +x "scripts/$TARGET_TRIPLE-clang.sh" "scripts/$TARGET_TRIPLE-clang++.sh"
          unset SODIUM_LIB_DIR || true
          ./scripts/build_native_bridge.sh "$TARGET_TRIPLE" release
          cp -f "entry/src/main/libs/$LIB_DIR/librustdesk_core.a" "./${{ matrix.release_file }}"
          ls -la "./${{ matrix.release_file }}"

      - name: 校验最终产物
        run: |
          artifact="./${{ matrix.release_file }}"
          test -f "$artifact"
          ls -la "$artifact"
          size=$(stat -c%s "$artifact")
          if [ "$size" -lt "$RELEASE_ARTIFACT_MIN_BYTES" ] || [ "$size" -gt "$RELEASE_ARTIFACT_MAX_BYTES" ]; then
            echo "Unexpected artifact size: $size"
            exit 1
          fi
          sha256sum "$artifact"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.release_file }}
          if-no-files-found: error

  release:
    name: 发布 Linux 双架构核心库
    needs: [reserve_release_number, build]
    runs-on: ubuntu-latest
    if: needs.build.result == 'success'

    steps:
      - name: 下载 arm64 产物
        uses: actions/download-artifact@v4
        with:
          name: librustdesk_core_linux_arm64
          path: ./release-assets

      - name: 下载 x86_64 产物
        uses: actions/download-artifact@v4
        with:
          name: librustdesk_core_linux_x86_64
          path: ./release-assets

      - name: 校验 Release 产物
        run: |
          set -euo pipefail
          ls -la ./release-assets/
          min_bytes=100000000
          max_bytes=250000000
          for f in ./release-assets/librustdesk_core.a ./release-assets/librustdesk_core_x86_64.a; do
            test -f "$f"
            size=$(wc -c < "$f")
            echo "=== $f ==="
            echo "Size: $size bytes"
            if [ "$size" -lt "$min_bytes" ] || [ "$size" -gt "$max_bytes" ]; then
              echo "Release asset size is outside expected range: $f ($size bytes)"
              exit 1
            fi
            sha256sum "$f"
          done

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.reserve_release_number.outputs.tag }}
          name: "librustdesk_core Linux Build ${{ needs.reserve_release_number.outputs.release_number }}"
          body: |
            ## 简介

            本次发布为 RustDesk HarmonyOS 原生核心静态库构建产物，用于 HarmonyOS / OpenHarmony 应用侧集成远控核心能力。

            该包基于 RustDesk 官方核心适配构建，包含 arm64 真机调试库和 x86_64 虚拟设备调试库，可直接放入 HAP 项目的对应 ABI 目录使用。

            ## 构建信息

            - 构建环境：Ubuntu 22.04
            - Rust 工具链：1.88.0
            - 目标平台：aarch64-unknown-linux-ohos + x86_64-unknown-linux-ohos
            - 构建配置：Cargo release profile
            - 发布标签：${{ needs.reserve_release_number.outputs.tag }}

            ## 产物说明

            - librustdesk_core.a：arm64-v8a，适用于 HarmonyOS 真机调试
            - librustdesk_core_x86_64.a：x86_64，适用于 HarmonyOS / OpenHarmony 虚拟设备调试

            ## 使用说明

            下载对应静态库后，复制到 HAP 项目的 `entry/src/main/libs/<ABI>/` 目录，并与当前仓库的 C++ NAPI 桥接层配套使用。
          files: ./release-assets/*
          overwrite_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}