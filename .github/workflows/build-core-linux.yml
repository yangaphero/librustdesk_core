name: 构建 HarmonyOS 核心库（Linux）

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: 构建核心库（${{ matrix.lib_dir }}）
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-ohos
            clang_target: aarch64-linux-ohos
            triplet: arm64-linux
            lib_dir: arm64
            artifact_name: librustdesk_core_linux_arm64
            release_file: librustdesk_core.a
          - target: x86_64-unknown-linux-ohos
            clang_target: x86_64-linux-ohos
            triplet: x64-linux
            lib_dir: x86_64
            artifact_name: librustdesk_core_linux_x86_64
            release_file: librustdesk_core_x86_64.a

    env:
      TARGET_TRIPLE: ${{ matrix.target }}
      CLANG_TARGET: ${{ matrix.clang_target }}
      RUST_TOOLCHAIN_VERSION: "1.88.0"
      RUSTDESK_HARMONY_BUILD_DIR: ${{ github.workspace }}/_build
      CARGO_TARGET_DIR: ${{ github.workspace }}/_build/native_rust_core/target
      VCPKG_ROOT: ${{ github.workspace }}/_build/vcpkg
      VCPKG_INSTALLED_ROOT: ${{ github.workspace }}/vcpkg/installed

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: ${{ matrix.target }}

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build autoconf automake libtool \
            pkg-config perl python3 curl git unzip p7zip-full \
            libssl-dev

      - name: 准备构建目录
        run: |
          mkdir -p "$RUSTDESK_HARMONY_BUILD_DIR" "$VCPKG_ROOT" "$VCPKG_INSTALLED_ROOT"

      - name: 安装 vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          export PATH="$VCPKG_ROOT:$PATH"
          ./vcpkg install libsodium:${TRIPLET} --triplet ${TRIPLET}
          ./vcpkg install opus:${TRIPLET} --triplet ${TRIPLET}

      - name: 构建核心库
        run: |
          export PATH="$VCPKG_ROOT:$PATH"
          export OHOS_SDK_HOME=/usr/local/harmony-sdk
          bash scripts/build_native_bridge.sh ${{ matrix.target }} release

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ github.workspace }}/_build/native_rust_core/target/${{ matrix.target }}/release/librustdesk_harmony_bridge.a

  release:
    name: 创建 Release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: 下载所有产物
        uses: actions/download-artifact@v4

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 生成版本号
          existing_numbers=$(
            gh api repos/${{ github.repository }}/git/matching-refs/tags/core- --paginate --jq '.[].ref' \
              | sed 's#^refs/tags/##' \
              | grep -E '^core-[0-9]{3}$' \
              | sed 's/^core-//' \
              | sort -n || true
          )
          if [ -z "$existing_numbers" ]; then
            next=1
          else
            last=$(printf '%s\n' "$existing_numbers" | tail -1)
            next=$((10#$last + 1))
          fi
          tag="core-$(printf '%03d' $next)"
          
          # 创建 Release
          gh release create "$tag" \
            --title "HarmonyOS Core $tag" \
            --generate-notes \
            librustdesk_core_linux_arm64/librustdesk_core.a \
            librustdesk_core_linux_x86_64/librustdesk_core.a
          
          echo "tag=$tag" >> $GITHUB_OUTPUT
