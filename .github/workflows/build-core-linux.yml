name: 构建 HarmonyOS 核心库（Linux）

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: 构建核心库（${{ matrix.lib_dir }}）
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-ohos
            clang_target: aarch64-linux-ohos
            triplet: arm64-linux
            lib_dir: arm64
            artifact_name: librustdesk_core_linux_arm64
            release_file: librustdesk_core.a
          - target: x86_64-unknown-linux-ohos
            clang_target: x86_64-linux-ohos
            triplet: x64-linux
            lib_dir: x86_64
            artifact_name: librustdesk_core_linux_x86_64
            release_file: librustdesk_core_x86_64.a

    env:
      TARGET_TRIPLE: ${{ matrix.target }}
      CLANG_TARGET: ${{ matrix.clang_target }}
      TRIPLET: ${{ matrix.triplet }}
      RUST_TOOLCHAIN_VERSION: "1.88.0"
      RUSTDESK_HARMONY_BUILD_DIR: ${{ github.workspace }}/_build
      BUILD_ROOT: ${{ github.workspace }}/_build
      CARGO_TARGET_DIR: ${{ github.workspace }}/_build/native_rust_core/target
      VCPKG_ROOT: ${{ github.workspace }}/_build/vcpkg
      VCPKG_INSTALLED_ROOT: ${{ github.workspace }}/_build/vcpkg/installed
      SDK_VERSION: 6.1.1.280
      SDK_REPO: ErBWs/ohos-sdk

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置脚本执行权限
        run: |
          chmod +x scripts/*.sh
          for f in scripts/*.sh; do
            test -x "$f" || { echo "ERROR: $f is not executable"; exit 1; }
          done

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.target }}

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build autoconf automake libtool autoconf-archive \
            pkg-config perl python3 curl git unzip p7zip-full \
            libssl-dev tar gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: 准备构建目录
        run: |
          mkdir -p "$RUSTDESK_HARMONY_BUILD_DIR" "$VCPKG_ROOT" "$VCPKG_INSTALLED_ROOT"

      - name: 下载 OHOS SDK
        run: |
          set -euo pipefail
          sdk_archive="$RUSTDESK_HARMONY_BUILD_DIR/ohos-sdk.tar.gz"
          sdk_root="$RUSTDESK_HARMONY_BUILD_DIR/ohos-sdk"
          
          echo "Downloading OHOS SDK from $SDK_REPO..."
          cd "$RUSTDESK_HARMONY_BUILD_DIR"
          
          for part in aa ab; do
            curl -L -f -o "ohos-sdk.$part" "https://github.com/$SDK_REPO/releases/download/$SDK_VERSION/ohos-sdk-linux-amd64.tar.gz.$part" || {
              echo "Failed to download part $part"
              exit 1
            }
          done
          
          cat ohos-sdk.aa ohos-sdk.ab > "$sdk_archive"
          rm -f ohos-sdk.aa ohos-sdk.ab
          
          tar -xzf "$sdk_archive" -C "$RUSTDESK_HARMONY_BUILD_DIR" || {
            echo "Failed to extract SDK"
            exit 1
          }
          rm -f "$sdk_archive"
          
          # 查找并移动 SDK 到标准位置
          if [ -f "$RUSTDESK_HARMONY_BUILD_DIR/command-line-tools/sdk/default/openharmony/native/llvm/bin/clang" ] || \
             [ -L "$RUSTDESK_HARMONY_BUILD_DIR/command-line-tools/sdk/default/openharmony/native/llvm/bin/clang" ]; then
            mkdir -p "$(dirname "$sdk_root")"
            mv "$RUSTDESK_HARMONY_BUILD_DIR/command-line-tools/sdk/default/openharmony" "$sdk_root"
          elif [ -d "$RUSTDESK_HARMONY_BUILD_DIR/openharmony/native/llvm/bin" ]; then
            mkdir -p "$(dirname "$sdk_root")"
            mv "$RUSTDESK_HARMONY_BUILD_DIR/openharmony" "$sdk_root"
          else
            echo "ERROR: Cannot find SDK"
            find "$RUSTDESK_HARMONY_BUILD_DIR" -maxdepth 4 -type d | head -30
            exit 1
          fi
          
          echo "SDK installed to: $sdk_root"
          ls -la "$sdk_root/native/llvm/bin/" | head -5

      - name: 安装 vcpkg 和依赖
        run: |
          rm -rf "$VCPKG_ROOT"
          mkdir -p "$VCPKG_ROOT"
          
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          
          VCPKG_BIN="$VCPKG_ROOT/vcpkg"
          
          echo "Installing opus for $TRIPLET..."
          "$VCPKG_BIN" install opus:"$TRIPLET" --triplet="$TRIPLET"
          
          echo "vcpkg installation completed"

      - name: 显示构建环境
        run: |
          echo "=== Build Environment ==="
          echo "TARGET_TRIPLE: $TARGET_TRIPLE"
          echo "TRIPLET: $TRIPLET"
          echo "OHOS_SDK_HOME: $OHOS_SDK_HOME"
          echo "VCPKG_ROOT: $VCPKG_ROOT"
          echo "========================"

      - name: 构建核心库
        run: |
          set -exuo pipefail
          export PATH="$VCPKG_ROOT:$PATH"
          export OHOS_SDK_HOME="$RUSTDESK_HARMONY_BUILD_DIR/ohos-sdk"
          export VCPKG_FORCE_SYSTEM_BINARIES=1
          export PKG_CONFIG_PATH="$VCPKG_INSTALLED_ROOT/$TRIPLET/lib/pkgconfig"

          echo "=== Build Environment ==="
          echo "TARGET_TRIPLE: $TARGET_TRIPLE"
          echo "OHOS_SDK_HOME: $OHOS_SDK_HOME"
          echo "VCPKG_ROOT: $VCPKG_ROOT"
          echo "CARGO_TARGET_DIR: $CARGO_TARGET_DIR"
          echo "SODIUM_LIB_DIR: ${SODIUM_LIB_DIR:-<not set>}"
          echo "========================="
          
          # 检查 SDK 是否存在
          if [ -f "$OHOS_SDK_HOME/native/llvm/bin/clang" ]; then
            echo "SDK clang found: $OHOS_SDK_HOME/native/llvm/bin/clang"
          else
            echo "ERROR: SDK clang not found at $OHOS_SDK_HOME"
            ls -la "$OHOS_SDK_HOME/" 2>/dev/null || echo "SDK directory not found"
            find "$RUSTDESK_HARMONY_BUILD_DIR" -name "clang" -type f 2>/dev/null | head -5
            exit 1
          fi

          echo "=== Starting Build ==="
          echo "Building for target: $TARGET_TRIPLE"
          
          # 运行构建并捕获输出
          BUILD_LOG=$(mktemp)
          bash scripts/build_native_bridge.sh "$TARGET_TRIPLE" release 2>&1 | tee "$BUILD_LOG" || {
            echo "Build failed with exit code ${PIPESTATUS[0]}"
            echo "=== Last 50 lines of build output ==="
            tail -50 "$BUILD_LOG"
            echo "=== Checking for specific errors ==="
            grep -i "error\|panic\|failed" "$BUILD_LOG" | tail -30
            exit 1
          }

          echo "=== Build Completed ==="

      - name: 验证构建产物
        run: |
          echo "=== Checking Build Artifacts ==="
          artifact_dir="$RUSTDESK_HARMONY_BUILD_DIR/native_rust_core/target/${{ matrix.target }}/release"
          echo "Artifact directory: $artifact_dir"
          ls -la "$artifact_dir" 2>/dev/null || echo "Artifact directory not found"
          
          if [ -f "$artifact_dir/${{ matrix.release_file }}" ]; then
            echo "✓ ${{ matrix.release_file }} found"
            ls -lh "$artifact_dir/${{ matrix.release_file }}"
          elif [ -f "$artifact_dir/librustdesk_harmony_bridge.a" ]; then
            echo "✓ librustdesk_harmony_bridge.a found"
            ls -lh "$artifact_dir/librustdesk_harmony_bridge.a"
          elif [ -f "$artifact_dir/rustdesk_harmony_bridge.a" ]; then
            echo "✓ rustdesk_harmony_bridge.a found"
            ls -lh "$artifact_dir/rustdesk_harmony_bridge.a"
          else
            echo "✗ No static library found!"
            find "$artifact_dir" -name "*.a" 2>/dev/null | head -10
            exit 1
          fi

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ github.workspace }}/_build/native_rust_core/target/${{ matrix.target }}/release/${{ matrix.release_file }}
          retention-days: 7

  release:
    name: 创建 Release
    needs: build
    runs-on: ubuntu-22.04
    if: success()
    steps:
      - name: 下载所有产物
        uses: actions/download-artifact@v4

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          
          existing_numbers=$(
            gh api repos/${{ github.repository }}/git/matching-refs/tags/core- --paginate --jq '.[].ref' \
              | sed 's#^refs/tags/##' \
              | grep -E '^core-[0-9]{3}$' \
              | sed 's/^core-//' \
              | sort -n || true
          )
          if [ -z "$existing_numbers" ]; then
            next=1
          else
            last=$(printf '%s\n' "$existing_numbers" | tail -1)
            next=$((10#$last + 1))
          fi
          tag="core-$(printf '%03d' $next)"
          
          echo "Creating release: $tag"
          
          ls -la librustdesk_core_linux_arm64/ 2>/dev/null || true
          ls -la librustdesk_core_linux_x86_64/ 2>/dev/null || true
          
          gh release create "$tag" \
            --title "HarmonyOS Core $tag" \
            --generate-notes \
            librustdesk_core_linux_arm64/librustdesk_core.a \
            librustdesk_core_linux_x86_64/librustdesk_core_x86_64.a || {
            echo "Failed to create release"
            exit 1
          }
          
          echo "Release created: $tag"
